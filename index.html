:root{--bg:#f4f1ec;--fg:#1d2433;--card:#fff;--line:#d9d3c8;--accent:#8a1f3d;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#171a21;--fg:#eceae5;--card:#232733;--line:#3a4050;--accent:#d36b8a;--on:#171a21}}
:root[data-theme="dark"]{--bg:#171a21;--fg:#eceae5;--card:#232733;--line:#3a4050;--accent:#d36b8a;--on:#171a21}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:20px}
.picker{max-width:980px;margin:0 auto 16px}.picker .lbl{font-size:13px;opacity:.8;margin:0 0 8px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;-webkit-overflow-scrolling:touch}
.tab{flex:0 0 auto;width:78px;border:2px solid var(--line);border-radius:10px;padding:0;background:var(--card);color:var(--fg);cursor:pointer;overflow:hidden;text-align:center}
.tab img{display:block;width:100%;height:100px;object-fit:cover}.tab .cap{display:block;font-size:10px;line-height:1.2;padding:4px 3px;min-height:30px}
.tab.on{border-color:var(--accent)}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.panel{flex:1 1 300px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;min-width:0}
h1{font-size:18px;margin:0 0 4px}.sub{font-size:13px;opacity:.7;margin:0 0 4px}
label{font-size:13px;opacity:.8;display:block;margin:16px 0 6px}
input{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
input:focus{outline:2px solid var(--accent)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chip{border:1px solid var(--line);background:none;color:var(--fg);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}.chip:hover{border-color:var(--accent)}
.hint{font-size:12px;opacity:.65;margin-top:6px}
.row{display:flex;gap:10px;margin-top:18px;align-items:center;flex-wrap:wrap}
.btn{background:var(--accent);color:var(--on);border:0;border-radius:10px;padding:12px 18px;font-size:15px;font-weight:600;cursor:pointer}
.btn.alt{background:none;color:var(--accent);border:2px solid var(--accent);padding:10px 16px}
#msg{font-size:13px;opacity:.8}
.preview{flex:1 1 320px;max-width:460px;margin:0 auto}
canvas{width:100%;height:auto;filter:drop-shadow(0 8px 18px rgba(0,0,0,.3));display:block}
#tn{font-size:12px;opacity:.65;margin:8px 2px 0;text-align:center}
@media (max-width:720px){.preview{order:-1}}
</style>
</head>
<body>
<div class="picker"><div class="lbl">Шаблон</div><div class="tabs" id="tabs"></div></div>
<div class="wrap">
  <div class="panel">
    <h1>Пригласительное</h1>
    <p class="sub">Выберите шаблон, заполните три поля и скачайте картинку.</p>
    <label for="g">Обращение</label>
    <input id="g" value="Уважаемый(-ая)" autocomplete="off">
    <div class="chips"><button type="button" class="chip" data-v="Уважаемый">Уважаемый</button><button type="button" class="chip" data-v="Уважаемая">Уважаемая</button><button type="button" class="chip" data-v="Уважаемые">Уважаемые</button></div>
    <label for="n">ФИО гостя</label>
    <input id="n" value="Николай Петрович" autocomplete="off">
    <label for="d">Подтвердить присутствие до</label>
    <input id="d" value="23.10" autocomplete="off">
    <div class="hint">Например: 23.10 или 25 октября. Точка в конце ставится сама.</div>
    <div class="row"><button class="btn" id="dl" type="button">Скачать PNG</button><button class="btn alt" id="dlj" type="button">Скачать JPEG</button><span id="msg"></span></div>
    <div class="hint" style="margin-top:10px">PNG: без потерь, файл тяжелее. JPEG: заметно легче, хватает для мессенджеров и почты.</div>
  </div>
  <div class="preview"><canvas id="c"></canvas><div id="tn"></div></div>
